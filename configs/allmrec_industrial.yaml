# A-LLMRec + Industrial_and_Scientific — pipeline reference (flat key-value, same format as seqrec_*.yaml).
# Data TSV paths for NDCG@k evaluation: use configs/seqrec_industrial.yaml (--config) with evaluation/eval_allmrec_sasrec_ndcg.py
coursework_eval_config: configs/seqrec_industrial.yaml
category: Industrial_and_Scientific
topk: 10
metric_name: NDCG@10
llmrec_conda_env: llmrec
pip_extras_file: requirements-llmrec.txt
allmrec_root: A-LLMRec
amazon_data_dir: A-LLMRec/data/amazon
prepare_script: scripts/prepare_allmrec_amazon_data.py
train_sasrec_script: A-LLMRec/train_sasrec_coursework.py
sasrec_checkpoint_glob: A-LLMRec/pre_train/sasrec/Industrial_and_Scientific/SASRec.epoch=*.pth
pipeline_script: scripts/run_allmrec_industrial.py
default_train_epochs: 50
default_batch_size: 128
default_allmrec_maxlen: 50
default_allmrec_hidden_units: 128
default_allmrec_num_blocks: 2
default_allmrec_num_heads: 2
default_learning_rate: 0.001
