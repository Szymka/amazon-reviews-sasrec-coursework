# LLMRank sequential backbone — Musical_Instruments.
category: Musical_Instruments
processed_dir: data/processed/Musical_Instruments
train_file: data/processed/Musical_Instruments/train.tsv
dev_file: data/processed/Musical_Instruments/dev.tsv
test_file: data/processed/Musical_Instruments/test.tsv
stats_file: data/processed/Musical_Instruments/stats.json

maxlen: 50
hidden_units: 128
num_blocks: 2
num_heads: 2
dropout_rate: 0.2
learning_rate: 0.001
weight_decay: 0.0001
train_loss_mode: sampled
num_sampled_negatives: 512
batch_size: 256
num_epochs: 100
topk: 10
seed: 42

early_stop_patience: 5
early_stop_min_delta: 0.0
