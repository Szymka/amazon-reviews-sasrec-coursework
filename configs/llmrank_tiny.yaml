# Smoke config: examples/tiny_sample (no GPU required for a short CPU run).
category: tiny_sample
processed_dir: examples/tiny_sample
train_file: examples/tiny_sample/train.tsv
dev_file: examples/tiny_sample/dev.tsv
test_file: examples/tiny_sample/test.tsv
stats_file: examples/tiny_sample/stats.json

maxlen: 10
hidden_units: 64
num_blocks: 2
num_heads: 2
dropout_rate: 0.2
learning_rate: 0.001
batch_size: 2
num_epochs: 2
train_loss_mode: sampled
num_sampled_negatives: 4
weight_decay: 0.0001
topk: 10
seed: 42

early_stop_patience: 3
early_stop_min_delta: 0.0
